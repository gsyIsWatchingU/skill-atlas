name: 桌面端构建与发布

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-packer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: 构建检查
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci
        env:
          # CI 只跑测试与语法检查，不需要 Electron 的二进制（约 100 MB）。
          # 桌面打包在本地跑 npm run dist，不占 CI 时间。
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: 运行测试
        run: npm test

      - name: 检查语法
        run: |
          node --check src/main.js
          node --check src/cloud-api.js
          node --check src/preload.js
          node --check src/settings.js
          node --check src/usage-scanner.js
          node --check src/scanner/index.js
          node --check src/renderer/app.js
          node --check scripts/desktop.js
          node --check bin/skill-packer.js

  desktop-release:
    name: 构建并发布 Windows 安装包
    needs: quality
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      # 没买代码签名证书，关掉自动探测，避免 electron-builder 卡在找证书上
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # electron 二进制和 electron-builder 工具链（winCodeSign、NSIS）每次重新下很慢，
      # 缓存下来第二次起直接命中。
      - name: 缓存 Electron 与 electron-builder 工具链
        uses: actions/cache@v4
        with:
          path: |
            %LOCALAPPDATA%\electron\Cache
            %LOCALAPPDATA%\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}

      - name: 安装依赖
        run: npm ci

      # 每次推到 main 都要出一个"新"包，版本号必须严格递增，否则
      # electron-builder 会认为是同一个版本、把旧产物顶掉。
      # 做法：取 package.json 里的基线版本，挂上 CI run number 作为预发布后缀，
      # 例如 2.2.0 -> 2.2.0-beta.42。这是预发布版，GitHub 会自动打 prerelease 标记。
      - name: 计算预发布版本号
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          base=$(node -p "require('./package.json').version")
          version="${base}-beta.${GITHUB_RUN_NUMBER}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          npm version "$version" --no-git-tag-version

      # 打包前先按真实启动路径跑一遍扫描自检，避免打出来的包在用户那边起不来。
      # windows-latest 是远程会话，必须加 --headless 走软件渲染，否则 GPU 进程 FATAL。
      # 非阻塞：CI 环境的 GPU/显示栈偶发问题不该挡住打包发布。
      - name: 桌面端启动自检
        continue-on-error: true
        run: node scripts/desktop.js --headless --smoke

      - name: 构建并发布到 GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --publish always

      # 双保险：除了挂到 GitHub Release，也留一份 CI artifact 备查，
      # 万一 Release 上传挂了还能从 Actions 里把 exe 捞出来。
      - name: 留存安装包与更新元数据
        uses: actions/upload-artifact@v4
        with:
          name: Skill-Packer-Setup-${{ steps.ver.outputs.version }}
          path: |
            outputs/*.exe
            outputs/*.yml
            outputs/*.blockmap
          if-no-files-found: error
          retention-days: 14
